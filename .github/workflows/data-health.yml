name: Data Health

on:
  schedule:
    # Run after the hourly ingestion repair window, not immediately after the
    # busiest part of the UTC hour.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-health
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        shell: bash
        run: |
          set +e
          final_status=1
          for attempt in 1 2 3; do
            npm run db:migrate
            final_status=$?
            if [ "$final_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Database migration attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit "$final_status"
      - name: Check data health and repair stale data
        run: npm run data:repair
