name: Data Health

on:
  schedule:
    # Run after the hourly ingestion repair window, not immediately after the
    # busiest part of the UTC hour.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-health
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Check data health and repair stale data
        run: npm run data:repair
