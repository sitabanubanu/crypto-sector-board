name: Quality

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "data/snapshots/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run registry:check
      - run: npm run db:check
      - run: npm test
      - run: npm run audit:prod
      - run: npm run audit:all-policy
      - run: npm run build
