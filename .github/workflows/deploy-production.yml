name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - name: Run release quality gate
        run: npm run check
      - name: Apply database migrations before deployment
        run: npm run db:migrate

      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"

      - name: Deploy the linked project to Vercel Production
        run: npx --yes vercel@58.4.4 deploy --prod --yes --token "$VERCEL_TOKEN"
