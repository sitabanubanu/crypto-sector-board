name: Market Data Ingestion

on:
  schedule:
    # Keep a second attempt later in the hour so a delayed/dropped scheduled
    # event can be recovered without introducing a paid scheduler.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-data-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Ingest quotes, market caps, and closed 1h candles
        shell: bash
        run: |
          set +e
          final_status=1
          for attempt in 1 2 3; do
            npm run ingest-market-data
            final_status=$?
            if [ "$final_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 300))
            fi
          done
          exit "$final_status"
