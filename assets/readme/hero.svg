<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">加密板块强弱看板</title>
  <desc id="desc">每小时汇总 56 个资产和 14 个板块，用市场广度、排名变化、贡献者与 Treemap 观察板块轮动。</desc>

  <rect width="1200" height="420" rx="28" fill="#f5f6f8"/>
  <rect x="1" y="1" width="1198" height="418" rx="27"
        fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="54" fill="#57606a" font-size="18" font-weight="700"
          letter-spacing="2">CRYPTO SECTOR MAP / MARKET PULSE</text>
    <text x="56" y="132" fill="#1f2328" font-size="60" font-weight="800">加密板块</text>
    <text x="56" y="198" fill="#1f2328" font-size="60" font-weight="800">强弱看板</text>
    <text x="58" y="252" fill="#1f2328" font-size="26" font-weight="700">
      先看市场广度，再看板块轮动。
    </text>
    <text x="58" y="291" fill="#57606a" font-size="21" font-weight="500">
      56 个资产 · 14 个板块 · 4 个周期 · 每小时更新
    </text>
  </g>

  <g id="metadata"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="17" font-weight="700">
    <rect x="58" y="336" width="138" height="38" rx="19" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="79" cy="355" r="6" fill="#38a169"/>
    <text x="94" y="361" fill="#1f2328">LIVE DATA</text>
    <rect x="208" y="336" width="164" height="38" rx="19" fill="#ffffff" stroke="#d0d7de"/>
    <text x="229" y="361" fill="#1f2328">EXPLAINABLE</text>
    <rect x="384" y="336" width="146" height="38" rx="19" fill="#ffffff" stroke="#d0d7de"/>
    <text x="405" y="361" fill="#1f2328">DB BACKED</text>
  </g>

  <g id="product-proof"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="626" y="28" width="534" height="364" rx="22" fill="#ffffff"
          stroke="#d0d7de" stroke-width="2"/>

    <g id="pulse-summary">
      <text x="650" y="62" fill="#1f2328" font-size="21" font-weight="800">市场脉搏</text>
      <text x="650" y="91" fill="#e53e3e" font-size="25" font-weight="800">广度 27%</text>
      <text x="770" y="89" fill="#57606a" font-size="18" font-weight="600">n=56 · 对比上一完整 UTC 日</text>

      <rect x="650" y="109" width="151" height="72" rx="12" fill="#fff5f5" stroke="#fc8181"/>
      <text x="666" y="136" fill="#1f2328" font-size="19" font-weight="800">#1 其他主流</text>
      <text x="666" y="164" fill="#e53e3e" font-size="18" font-weight="700">↑1 · 贡献 PI</text>

      <rect x="812" y="109" width="151" height="72" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="828" y="136" fill="#1f2328" font-size="19" font-weight="800">#2 隐私币</text>
      <text x="828" y="164" fill="#57606a" font-size="18" font-weight="700">— · XMR/ZEC</text>

      <rect x="974" y="109" width="162" height="72" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="990" y="136" fill="#1f2328" font-size="19" font-weight="800">#3 L2 &amp; 扩容</text>
      <text x="990" y="164" fill="#57606a" font-size="18" font-weight="700">→ · MNT/ARB</text>
    </g>

    <g id="treemap" stroke="#ffffff" stroke-width="5">
      <rect x="650" y="201" width="236" height="164" rx="10" fill="#c6f6d5"/>
      <rect x="886" y="201" width="129" height="164" rx="10" fill="#fed7d7"/>
      <rect x="1015" y="201" width="121" height="92" rx="10" fill="#38a169"/>
      <rect x="1015" y="293" width="72" height="72" rx="10" fill="#fc8181"/>
      <rect x="1087" y="293" width="49" height="72" rx="10" fill="#68d391"/>
    </g>

    <g fill="#1f2328">
      <text x="674" y="232" font-size="21" font-weight="800">LAYER 1</text>
      <text x="674" y="266" font-size="24" font-weight="800">ETH · SOL</text>
      <text x="674" y="337" font-size="18" fill="#57606a">市值面积 · 24h -0.85%</text>

      <text x="910" y="232" font-size="21" font-weight="800">BTC</text>
      <text x="910" y="286" font-size="28" font-weight="800">-0.39%</text>

      <text x="1036" y="232" font-size="20" font-weight="800" fill="#ffffff">DeFi</text>
      <text x="1036" y="260" font-size="18" font-weight="700" fill="#ffffff">-4.57%</text>

      <text x="1033" y="326" font-size="18" font-weight="800">隐私币</text>
      <text x="1098" y="326" font-size="18" font-weight="800" fill="#ffffff">AI</text>
    </g>
  </g>
</svg>
