<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">加密板块强弱看板</title>
  <desc id="desc">把 56 个加密资产归入 14 个板块，并用 Treemap 比较四个时间周期的强弱。</desc>

  <rect width="1200" height="400" rx="28" fill="#f5f6f8"/>
  <rect x="1" y="1" width="1198" height="398" rx="27"
        fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="57" fill="#57606a" font-size="18" font-weight="700"
          letter-spacing="2">MARKET STRUCTURE / PERSONAL DASHBOARD</text>
    <text x="56" y="137" fill="#1f2328" font-size="62" font-weight="800">加密板块</text>
    <text x="56" y="205" fill="#1f2328" font-size="62" font-weight="800">强弱看板</text>
    <text x="58" y="257" fill="#424a53" font-size="24" font-weight="500">
      把逐币涨跌放回板块结构，
    </text>
    <text x="58" y="291" fill="#424a53" font-size="24" font-weight="500">
      用同一口径比较 24h · 3d · 7d · 30d。
    </text>
  </g>

  <g id="metadata"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="18" font-weight="700">
    <rect x="58" y="330" width="142" height="36" rx="18" fill="#ffffff" stroke="#d0d7de"/>
    <text x="78" y="354" fill="#1f2328">14 SECTORS</text>
    <rect x="212" y="330" width="132" height="36" rx="18" fill="#ffffff" stroke="#d0d7de"/>
    <text x="232" y="354" fill="#1f2328">56 ASSETS</text>
    <rect x="356" y="330" width="152" height="36" rx="18" fill="#ffffff" stroke="#d0d7de"/>
    <text x="376" y="354" fill="#1f2328">4 HORIZONS</text>
  </g>

  <g id="treemap-proof"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="650" y="32" width="510" height="336" rx="20" fill="#ffffff"
          stroke="#d0d7de" stroke-width="2"/>
    <text x="676" y="65" fill="#57606a" font-size="18" font-weight="700"
          letter-spacing="1">RED = UP  /  GREEN = DOWN</text>

    <g stroke="#ffffff" stroke-width="6">
      <rect x="670" y="82" width="238" height="148" rx="8" fill="#fed7d7"/>
      <rect x="908" y="82" width="232" height="148" rx="8" fill="#fc8181"/>
      <rect x="670" y="230" width="150" height="114" rx="8" fill="#c6f6d5"/>
      <rect x="820" y="230" width="166" height="114" rx="8" fill="#e53e3e"/>
      <rect x="986" y="230" width="154" height="114" rx="8" fill="#68d391"/>
    </g>

    <g fill="#1f2328">
      <text x="692" y="115" font-size="22" font-weight="800">LAYER 1</text>
      <text x="692" y="144" font-size="18" font-weight="600">ETH · SOL · BNB</text>
      <text x="692" y="203" font-size="18" fill="#57606a">12 assets</text>

      <text x="932" y="121" font-size="25" font-weight="800">BTC</text>
      <text x="932" y="151" font-size="18" font-weight="600">market anchor</text>

      <text x="692" y="264" font-size="21" font-weight="800">DeFi</text>
      <text x="692" y="292" font-size="18" font-weight="600">UNI · AAVE</text>

      <text x="1008" y="264" font-size="21" font-weight="800">L2</text>
      <text x="1008" y="292" font-size="18" font-weight="600">ARB · OP</text>
    </g>

    <g fill="#ffffff">
      <text x="844" y="264" font-size="21" font-weight="800">AI</text>
      <text x="844" y="292" font-size="18" font-weight="600">FET · RENDER</text>
    </g>
  </g>
</svg>
