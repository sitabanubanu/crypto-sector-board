<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">加密板块强弱看板的数据路径</title>
  <desc id="desc">Gate、OKX 和 CoinGecko 经每小时采集进入 PostgreSQL，再由窄 BFF 提供给页面；只读 JSON 保留为回滚路径。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#f5f6f8"/>
  <rect x="1" y="1" width="1198" height="458" rx="27"
        fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="52" y="61" fill="#1f2328" font-size="40" font-weight="800">
      从上游行情到一个可回滚的读路径
    </text>
    <text x="52" y="95" fill="#57606a" font-size="20">
      页面只读版本化 BFF；采集、部署和浏览器请求彼此解耦。
    </text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 240 225 H 276"/>
    <path d="M 458 225 H 494"/>
    <path d="M 676 225 H 712"/>
    <path d="M 916 225 H 952"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="sources">
      <rect x="44" y="132" width="196" height="186" rx="18" fill="#ffffff"
            stroke="#d0d7de" stroke-width="2"/>
      <text x="66" y="166" fill="#57606a" font-size="18" font-weight="700">SOURCES</text>
      <circle cx="70" cy="201" r="8" fill="#e53e3e"/>
      <text x="90" y="208" fill="#1f2328" font-size="22" font-weight="700">Gate.io</text>
      <circle cx="70" cy="241" r="8" fill="#fc8181"/>
      <text x="90" y="248" fill="#1f2328" font-size="22" font-weight="700">OKX</text>
      <circle cx="70" cy="281" r="8" fill="#38a169"/>
      <text x="90" y="288" fill="#1f2328" font-size="22" font-weight="700">CoinGecko</text>
    </g>

    <g id="ingestion">
      <rect x="276" y="132" width="182" height="186" rx="18" fill="#ffffff"
            stroke="#d0d7de" stroke-width="2"/>
      <text x="298" y="166" fill="#57606a" font-size="18" font-weight="700">INGEST</text>
      <text x="298" y="208" fill="#1f2328" font-size="23" font-weight="800">每小时采集</text>
      <text x="298" y="245" fill="#424a53" font-size="19">限流重试</text>
      <text x="298" y="276" fill="#424a53" font-size="19">幂等 + 自动补洞</text>
    </g>

    <g id="database">
      <rect x="494" y="132" width="182" height="186" rx="18" fill="#ffffff"
            stroke="#d0d7de" stroke-width="2"/>
      <text x="516" y="166" fill="#57606a" font-size="18" font-weight="700">STORE</text>
      <text x="516" y="208" fill="#1f2328" font-size="23" font-weight="800">PostgreSQL</text>
      <text x="516" y="245" fill="#424a53" font-size="19">latest quotes</text>
      <text x="516" y="276" fill="#424a53" font-size="19">1h candles</text>
    </g>

    <g id="bff">
      <rect x="712" y="132" width="204" height="186" rx="18" fill="#ffffff"
            stroke="#d0d7de" stroke-width="2"/>
      <text x="734" y="166" fill="#57606a" font-size="18" font-weight="700">BFF / API V1</text>
      <text x="734" y="204" fill="#1f2328" font-size="21" font-weight="800">board · history</text>
      <text x="734" y="237" fill="#1f2328" font-size="21" font-weight="800">candles · health</text>
      <text x="734" y="278" fill="#424a53" font-size="19">严格契约 + 缓存</text>
    </g>

    <g id="view">
      <rect x="952" y="132" width="204" height="186" rx="18" fill="#ffffff"
            stroke="#d0d7de" stroke-width="2"/>
      <text x="974" y="166" fill="#57606a" font-size="18" font-weight="700">VIEW</text>
      <text x="974" y="208" fill="#1f2328" font-size="23" font-weight="800">Next.js 看板</text>
      <text x="974" y="245" fill="#424a53" font-size="19">SSR 首屏 + SWR</text>
      <text x="974" y="276" fill="#424a53" font-size="19">来源 / 覆盖 / 新鲜度</text>
    </g>
  </g>

  <g id="rollback"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="494" y="356" width="182" height="64" rx="16" fill="#ffffff"
          stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="516" y="382" fill="#57606a" font-size="17" font-weight="700">READ-ONLY FALLBACK</text>
    <text x="516" y="408" fill="#1f2328" font-size="20" font-weight="800">JSON snapshots</text>
    <path d="M 676 388 H 814 V 322" fill="none" stroke="#57606a"
          stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="708" y="376" fill="#57606a" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      DATA_BACKEND=json
    </text>
  </g>
</svg>
